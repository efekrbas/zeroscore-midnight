  <!-- Outer Shield Silhouette -->
  <path d="M50 8 L85 22 V50 C85 75 50 92 50 92 C50 92 15 75 15 50 V22 L50 8 Z" stroke="url(#zgrad)" stroke-width="3" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round" />
